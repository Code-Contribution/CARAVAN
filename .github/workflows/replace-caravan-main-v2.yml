name: Replace Caravan main from package v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/replace-caravan-main-v2.yml"

permissions:
  contents: write

jobs:
  replace-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply uploaded Caravan package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, shutil

          def blob_sha(path):
              data = Path(path).read_bytes()
              return hashlib.sha1(("blob %d\0" % len(data)).encode() + data).hexdigest()

          if blob_sha("CARAVAN_GAME.JS") != "7ca8a7c05f2ae2bb2e868d209ca93cb5327a5f03":
              raise SystemExit("Unexpected CARAVAN_GAME.JS baseline")
          if blob_sha("assets/CARAVAN_GAME.MIN.JS") != "653b7115754e2bb54d84884d928b0955d9041fa4":
              raise SystemExit("Unexpected CARAVAN_GAME.MIN.JS baseline")

          dev = Path("LOGGING_SYSTEM_DEV_ONLY")
          dev.mkdir(exist_ok=True)
          shutil.copyfile("CARAVAN_GAME.JS", dev / "CARAVAN_GAME_LOGGING.JS")
          shutil.copyfile("assets/CARAVAN_GAME.MIN.JS", dev / "CARAVAN_GAME_LOGGING.MIN.JS")

          source = Path("CARAVAN_GAME.JS").read_text()
          source = source.replace('        renderState = 0,\n        gameNumber = 0;', '        renderState = 0;', 1)
          source, count = re.subn(r'\n    // --- Diagnostics and render state ---\n.*?\n    function createRenderState', '\n    // --- Render state ---\n    function createRenderState', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Logging source function block not found")
          for line in (
              '        logEvent("DATAFREE")\n',
              '        logEvent("RESULT " + outcome);\n',
              '        logEvent("AUDIOFREE");\n',
              '        logEvent("REMATCH");\n',
              '        gameNumber++;\n',
              '        logEvent("AUDIOACTIVE");\n',
              '        logEvent("READY")\n',
              '        logEvent("AUDIOCORE");\n',
          ):
              source = source.replace(line, "")
          Path("CARAVAN_GAME.JS").write_text(source)

          runtime = Path("assets/CARAVAN_GAME.MIN.JS").read_text()
          for before, after in (
              (',renderState=0,gameNumber=0;', ',renderState=0;'),
              ('function lg(e){try{if(Pip.log){let m=process.memory();Pip.log("CV G"+gameNumber+" "+e+" F"+m.free+" T"+m.total,"CARAVAN.LOG")}}catch(error){}}', ''),
              (';lg("DATAFREE")', ''),
              (';lg("RESULT "+r)', ''),
              (';lg("AUDIOFREE")', ''),
              (';lg("REMATCH")', ''),
              (';gameNumber++', ''),
              (';lg("AUDIOACTIVE")', ''),
              (';lg("READY")', ''),
              (';lg("AUDIOCORE")', ''),
          ):
              runtime = runtime.replace(before, after)
          Path("assets/CARAVAN_GAME.MIN.JS").write_text(runtime)

          files = {
              "README.md": "",
              "metadata.json": "",
              "LOGGING_SYSTEM_DEV_ONLY/DO_NOT_INCLUDE_IN_PR.txt": ""
          }
          for path, encoded in files.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(encoded))

          expected = {
              "LOGGING_SYSTEM_DEV_ONLY/CARAVAN_GAME_LOGGING.JS": "7ca8a7c05f2ae2bb2e868d209ca93cb5327a5f03",
              "LOGGING_SYSTEM_DEV_ONLY/CARAVAN_GAME_LOGGING.MIN.JS": "653b7115754e2bb54d84884d928b0955d9041fa4",
              "LOGGING_SYSTEM_DEV_ONLY/DO_NOT_INCLUDE_IN_PR.txt": "3024175e68fa5886f20601163245419a4db09024",
              "CARAVAN_GAME.JS": "e4f85e631c672c15ab41950d966c42baa7ffc93f",
              "assets/CARAVAN_GAME.MIN.JS": "0c0498b09b62578d67393daa8697c910f57b0724",
              "README.md": "8a5cda7cc3be79d241aa7c42302d778bf8930981",
              "metadata.json": "5e87b898cd11e67816b2a1f7ea08d70be3ab27ff"
          }
          bad = [(p, blob_sha(p), sha) for p, sha in expected.items() if blob_sha(p) != sha]
          if bad:
              raise SystemExit("Package hash verification failed: " + repr(bad))
          print("Target package hashes verified")
          PY

          rm -f .github/workflows/replace-caravan-main.yml .github/workflows/replace-caravan-main-v2.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace main with Caravan v1.0.0 package"
          git push origin HEAD:main
